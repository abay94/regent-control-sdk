name: release

# Tag v* → test, build and publish to npm as @regent-protocol/control-sdk with provenance,
# through npm Trusted Publishing (OIDC): on npmjs.com the package's Settings → Trusted
# Publisher names this repository and this workflow file. No token anywhere.
# npm ≥ 11.5 is needed for trusted publishing, so the CLI is upgraded first.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # provenance + trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm publish --access public --provenance
